<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bugünün Paylaşımı</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0c10;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px;max-width:520px;margin:0 auto}
h1{color:#d4af37;font-size:1.3rem;margin-bottom:4px}
.gun{color:#94a3b8;font-size:.9rem;margin-bottom:16px}
video{width:100%;border-radius:14px;background:#000;display:block}
.btn{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;font-weight:700;font-size:1.05rem;text-align:center;text-decoration:none;cursor:pointer}
.indir{background:linear-gradient(135deg,#f4d36b,#d4af37 55%,#a8801f);color:#111}
.kopya{background:#25d366;color:#fff}
h2{font-size:1rem;margin:22px 0 8px}
textarea{width:100%;height:230px;background:#15171d;color:#eee;border:1px solid #333;border-radius:12px;padding:12px;font-size:.95rem;line-height:1.45}
ol{margin:6px 0 0 20px;color:#cbd5e1;line-height:1.7;font-size:.95rem}
</style>
</head>
<body>
<h1>Bugünün Paylaşımı</h1>
<p class="gun">Hangi Renk Sence?</p>
<video src="hangi_renk_1080.mp4" controls muted playsinline></video>
<a class="btn indir" href="hangi_renk_1080.mp4" download>Videoyu İndir</a>
<h2>Altına yazılacak metin</h2>
<textarea id="yazi" readonly>Hangi renk sence? 1, 2, 3 ya da 4 yaz 👇
Tavanına istediğin renkte LED yapıyoruz, ölçüne göre.
Ücretsiz keşif için DM at ya da ara 📩

📍 Kahramanmaraş • Antalya • Alanya
📞 0533 250 60 02

#ledtavan #asmatavan #ledaydınlatma #renklitavan #kahramanmaraş #antalya #alanya #dekorasyon</textarea>
<button class="btn kopya" onclick="var t=document.getElementById('yazi');t.select();t.setSelectionRange(0,99999);try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')};this.textContent='Kopyalandı ✓'">Yazıyı Kopyala</button>
<h2>Nasıl paylaşılır?</h2>
<ol><li>Videoyu indir.</li><li>Instagram'da + → Reels, videoyu seç.</li><li>Müziği Instagram'dan seç.</li><li>Yazıyı yapıştır, paylaş.</li><li>İlk 1 saat yorumlara cevap ver.</li></ol>
</body>
</html>

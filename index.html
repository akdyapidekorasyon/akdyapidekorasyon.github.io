<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akd Yapı Dekorasyon | Kahramanmaraş Alçıpan, TV Ünitesi & Çıta Tasarımı</title>
    <!-- Premium Yazı Tipi -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Akd Yapı Afiş Konseptli Ultra Premium CSS */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body { 
            background-color: #0a0b0d; /* Derin Premium Siyah */
            /* 3 Boyutlu Derinlik Veren Şık Baklava Çıta ve Işık Efekti */
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, rgba(212, 175, 55, 0.02) 25%, transparent 25%), 
                linear-gradient(225deg, rgba(212, 175, 55, 0.02) 25%, transparent 25%), 
                linear-gradient(45deg, rgba(212, 175, 55, 0.02) 25%, transparent 25%), 
                linear-gradient(315deg, rgba(212, 175, 55, 0.02) 25%, #0a0b0d 25%);
            background-position: 0 0, 40px 0, 40px 0, 0 0, 0 0;
            background-size: 100% 100%, 80px 80px, 80px 80px, 80px 80px, 80px 80px;
            color: #f8fafc; 
            line-height: 1.6; 
        }
        
        /* Afiş Esintili Gold Şeritli Üst Bar */
        .ust-bilgi-bari {
            background: rgba(13, 14, 18, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #a1a1aa;
            padding: 14px 20px;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 2px solid #d4af37; /* Keskin Gold Çizgi */
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ust-bilgi-bari a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        .ust-bilgi-bari a:hover {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        }

        /* Afiş Tarzı Muazzam Header Bölümü */
        header { 
            background: linear-gradient(180deg, rgba(13, 14, 18, 0.9) 0%, rgba(10, 11, 13, 0.4) 100%);
            text-align: center; 
            padding: 70px 20px; 
            position: relative;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }
        
        /* Logodaki Gibi Asil Altın Varak Yazı Tipi */
        header h1 { 
            font-size: 3.4rem; 
            margin-bottom: 8px; 
            font-weight: 800; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 10%, #d4af37 60%, #fef08a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(212, 175, 55, 0.4));
        }
        
        header p { 
            font-size: 1.25rem; 
            font-weight: 400;
            color: #a1a1aa;
            letter-spacing: 0.5px;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 20px; 
        }
        
        /* Afiş Özellik Kutuları (Modern Tasarım, 1. Sınıf Malzeme vb.) */
        .ozellikler-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .ozellik-karti {
            background: rgba(20, 22, 28, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .ozellik-karti:hover {
            border-color: #d4af37;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.1);
        }

        .ozellik-karti h4 {
            color: #d4af37;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .ozellik-karti p {
            color: #a1a1aa;
            font-size: 0.9rem;
        }

        /* Başlık Çizgisi */
        .bolum-basligi { 
            text-align: center; 
            color: #ffffff; 
            font-size: 2rem; 
            margin: 50px 0 30px 0; 
            font-weight: 700; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .bolum-basligi::after { 
            content: ''; 
            display: block; 
            width: 70px; 
            height: 3px; 
            background: #d4af37; 
            margin: 10px auto 0; 
            border-radius: 2px; 
        }
        
        /* Lüks Çerçeveli Grid Kart Sistemi */
        .media-gallery { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 25px; 
            margin-bottom: 40px; 
        }
        
        .media-item { 
            background: #13151a; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
            display: flex; 
            flex-direction: column; 
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .media-item:hover { 
            transform: translateY(-8px);
            border-color: #d4af37;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
        }
        
        .media-item img, .media-item video { 
            width: 100%; 
            height: 260px; 
            object-fit: cover; 
            background: #000; 
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
        }
        
        /* Net ve Doğru Alt Yazı Alanı */
        .media-desc { 
            padding: 18px; 
            text-align: center; 
            font-weight: 700; 
            color: #ffffff; 
            background: #171921; 
            font-size: 1rem; 
            letter-spacing: 0.3px;
            border-top: 1px solid rgba(255,255,255,0.02);
        }
        
        /* Afiş Tarzı Büyük ve Canlı Aksiyon Butonları */
        .btn-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 15px; 
            margin: 50px auto; 
        }
        
        .action-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: white; 
            text-decoration: none; 
            padding: 18px 35px; 
            border-radius: 50px; 
            font-size: 1.2rem; 
            font-weight: bold; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            transition: all 0.3s ease; 
            text-align: center; 
        }

        .action-btn:hover { 
            transform: scale(1.03) translateY(-2px); 
        }
        
        .action-btn svg { 
            width: 26px; 
            height: 26px; 
            margin-right: 12px; 
            fill: white; 
        }
        
        .whatsapp-btn { 
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%); 
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.2);
        }
        .whatsapp-btn:hover {
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.4);
        }
        
        .instagram-btn { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            box-shadow: 0 10px 25px rgba(220, 39, 67, 0.2);
        }
        .instagram-btn:hover {
            box-shadow: 0 15px 30px rgba(220, 39, 67, 0.4);
        }
        
        /* Ağır Koyu Tasarım Footer */
        footer { 
            background: #06070a; 
            color: #71717a; 
            text-align: center; 
            padding: 35px 20px; 
            font-size: 0.95rem; 
            margin-top: 60px; 
            border-top: 2px solid #d4af37; 
        }
        footer p { margin-bottom: 5px; }
        footer p strong { color: #e4e4e7; }

        /* Mobil Ekran Koruma Kriterleri */
        @media (max-width: 768px) { 
            header h1 { font-size: 2.2rem; } 
            .media-gallery { grid-template-columns: 1fr; } 
            .ust-bilgi-bari { flex-direction: column; text-align: center; }
            .ozellikler-container { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <style>
        :root { --altin: #d4af37; --altin-acik: #f4d36b; --altin-koyu: #a8801f; --koyu: #0b0c10; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', Arial, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--koyu); color: #f1f5f9; line-height: 1.6; }
        a { color: inherit; }

        /* ===== Tüm sayfa arka planı ===== */
        .sayfa-arka { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse at 20% 15%, rgba(212,175,55,0.30) 0%, transparent 55%), radial-gradient(ellipse at 85% 85%, rgba(168,128,31,0.28) 0%, transparent 50%), repeating-linear-gradient(115deg, rgba(212,175,55,0.07) 0 2px, transparent 2px 46px), linear-gradient(160deg, #15161c 0%, #0b0c10 60%, #1a1508 100%); }
        .sayfa-slides { position: absolute; inset: 0; }
        .slayt { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1); transition: opacity 1.8s ease, transform 10s linear; }
        .slayt.aktif { opacity: 1; transform: scale(1.06); }
        .sayfa-kaplama { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,12,16,0.30) 0%, rgba(11,12,16,0.40) 50%, rgba(11,12,16,0.72) 100%); }

        /* ===== Üst çubuk ===== */
        .ust-bilgi-bari { background: rgba(11,12,16,0.85); backdrop-filter: blur(8px); color: #94a3b8; padding: 12px 20px; font-size: .9rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid var(--altin); position: sticky; top: 0; z-index: 1000; }
        .ust-bilgi-bari a { color: var(--altin); text-decoration: none; font-weight: 700; }

        /* ===== Karşılama ===== */
        header { position: relative; text-align: center; padding: 90px 20px 80px; min-height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 2px solid rgba(212,175,55,0.7); }
        header::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(11,12,16,0.50) 0%, rgba(11,12,16,0.08) 75%); pointer-events: none; }
        .hero-icerik { position: relative; max-width: 920px; }
        .rozet { display: inline-block; margin-bottom: 18px; padding: 6px 16px; border: 1px solid rgba(212,175,55,0.7); border-radius: 999px; background: rgba(11,12,16,0.55); color: var(--altin-acik); font-size: .85rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; backdrop-filter: blur(4px); }
        header h1 { font-size: clamp(2.1rem, 6.5vw, 4.2rem); line-height: 1.1; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; background: linear-gradient(135deg, #ffffff 20%, #d4af37 60%, #fef08a 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.95)); }
        .cizgi { width: 90px; height: 4px; margin: 18px auto; border-radius: 2px; background: var(--altin); box-shadow: 0 0 18px rgba(212,175,55,0.9); animation: parla 2.6s ease-in-out infinite; }
        @keyframes parla { 0%,100% { width: 60px; opacity: .8; } 50% { width: 130px; opacity: 1; } }
        header p.slogan { color: #f1f5f9; text-shadow: 0 2px 12px rgba(0,0,0,1); font-size: clamp(1rem, 2.4vw, 1.3rem); }
        .etiketler { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 24px 0; }
        .etiketler span { padding: 7px 16px; border-radius: 999px; font-size: .9rem; font-weight: 600; color: #fff; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(4px); }
        .btnler { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 8px; }
        .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 28px; border-radius: 14px; font-weight: 800; font-size: 1.05rem; text-decoration: none; color: #fff; border: 0; cursor: pointer; transition: transform .25s ease, box-shadow .25s ease; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
        .btn:hover { transform: translateY(-3px) scale(1.04); }
        .btn.altin { background: linear-gradient(135deg, var(--altin-acik), var(--altin) 55%, var(--altin-koyu)); color: #111; box-shadow: 0 8px 26px rgba(212,175,55,0.5); }
        .btn.yesil { background: linear-gradient(135deg, #25d366, #128c7e); }
        .btn.cerceve { background: rgba(11,12,16,0.6); border: 1px solid var(--altin); color: #fff; backdrop-filter: blur(4px); }
        .btn svg { width: 22px; height: 22px; fill: currentColor; }
        .sayilar { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 18px; }
        #sayilar-sabit { margin-top: 34px; }
        .sayilar[hidden] { display: none; }
        .sayi-kutu { min-width: 150px; padding: 12px 22px; border-radius: 14px; background: rgba(11,12,16,0.6); border: 1px solid rgba(212,175,55,0.5); backdrop-filter: blur(4px); }
        .sayi-kutu strong { display: block; font-size: 2rem; line-height: 1.1; color: var(--altin-acik); font-weight: 800; }
        .sayi-kutu span { font-size: .85rem; color: #cbd5e1; }

        /* ===== Bölümler ===== */
        .bolum { max-width: 1200px; margin: 0 auto; padding: 36px 20px 8px; }
        .cam { background: rgba(11,12,16,0.5); backdrop-filter: blur(6px); border: 1px solid rgba(212,175,55,0.45); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); padding: 34px 26px; }
        .baslik-b { text-align: center; color: #fff; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; margin-bottom: 8px; text-shadow: 0 2px 12px rgba(0,0,0,0.95); }
        .baslik-b::after { content: ''; display: block; width: 60px; height: 4px; background: var(--altin); margin: 12px auto 0; border-radius: 2px; box-shadow: 0 0 14px rgba(212,175,55,0.8); }
        .alt-yazi { text-align: center; color: #e2e8f0; max-width: 720px; margin: 14px auto 28px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }

        .izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
        .kutu { background: rgba(22,25,32,0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px 20px; transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease; }
        .kutu:hover { transform: translateY(-6px); border-color: var(--altin); box-shadow: 0 14px 30px rgba(212,175,55,0.2); }
        .kutu .ikon { font-size: 2rem; margin-bottom: 8px; }
        .kutu h3 { color: var(--altin-acik); font-size: 1.15rem; margin-bottom: 6px; }
        .kutu p { color: #cbd5e1; font-size: .95rem; }
        .kutu .btn { margin-top: 14px; padding: 11px 20px; font-size: .95rem; }

        .adim-no { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem; color: #111; background: linear-gradient(135deg, var(--altin-acik), var(--altin-koyu)); margin-bottom: 10px; }

        /* ===== Galeri ===== */
        .filtreler { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 0 28px; }
        .filtre { cursor: pointer; padding: 10px 20px; border-radius: 999px; font-size: .95rem; font-weight: 700; color: #e2e8f0; background: rgba(11,12,16,0.7); border: 1px solid rgba(212,175,55,0.35); backdrop-filter: blur(4px); transition: all .25s ease; }
        .filtre:hover { border-color: var(--altin); color: #fff; }
        .filtre.aktif { background: linear-gradient(135deg, var(--altin-acik), var(--altin) 55%, var(--altin-koyu)); color: #111; border-color: var(--altin); }
        .filtre small { opacity: .75; font-weight: 600; margin-left: 4px; }
        .galeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; align-items: start; }
        .kart { background: rgba(22,25,32,0.92); border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); }
        .kart:hover { transform: translateY(-5px); border-color: var(--altin); box-shadow: 0 15px 30px rgba(212,175,55,0.2); }
        .kart img { width: 100%; height: 250px; object-fit: cover; background: #000; border-bottom: 3px solid var(--altin); cursor: zoom-in; display: block; }
        .kart video { width: 100%; height: 420px; object-fit: contain; background: #000; border-bottom: 3px solid var(--altin); display: block; }
        .kart .baslik { padding: 15px; text-align: center; font-weight: 700; color: #fff; background: #1a1d24; letter-spacing: .5px; word-wrap: break-word; }
        .mesaj { grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 30px 10px; }
        .daha-fazla-kutu { text-align: center; }
        .daha-fazla[hidden] { display: none; }

        /* ===== Form ===== */
        .form-izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 820px; margin: 0 auto; }
        .alan { display: flex; flex-direction: column; gap: 6px; }
        .alan.tam { grid-column: 1 / -1; }
        .alan label { font-weight: 700; font-size: .9rem; color: #e2e8f0; }
        .alan input, .alan select, .alan textarea { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25); background: rgba(11,12,16,0.75); color: #fff; font-size: 1rem; outline: none; }
        .alan input:focus, .alan select:focus, .alan textarea:focus { border-color: var(--altin); box-shadow: 0 0 0 3px rgba(212,175,55,0.25); }
        .alan select option { background: #161920; color: #fff; }
        .alan textarea { min-height: 96px; resize: vertical; }
        .form-alt { text-align: center; margin-top: 22px; }
        .form-not { color: #94a3b8; font-size: .85rem; margin-top: 10px; }

        /* ===== İletişim ===== */
        .iletisim-kartlar { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; max-width: 880px; margin: 0 auto; }
        .iletisim-kart { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 24px 16px; border-radius: 16px; text-decoration: none; color: #fff; background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.25); backdrop-filter: blur(6px); transition: transform .25s ease, border-color .25s ease, background .25s ease; text-align: center; }
        .iletisim-kart:hover { transform: translateY(-6px); border-color: var(--altin); background: rgba(255,255,255,0.16); }
        .iletisim-kart .ikon-yuvarlak { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; margin-bottom: 8px; }
        .iletisim-kart .ikon-yuvarlak svg { width: 28px; height: 28px; fill: #fff; }
        .ara .ikon-yuvarlak { background: linear-gradient(135deg, var(--altin-acik), var(--altin-koyu)); }
        .wp .ikon-yuvarlak { background: linear-gradient(135deg, #25d366, #128c7e); }
        .ig .ikon-yuvarlak { background: linear-gradient(45deg, #f09433, #dc2743 50%, #bc1888); }
        .iletisim-kart small { color: #cbd5e1; font-size: .9rem; }
        .iletisim-kart strong { font-size: 1.2rem; font-weight: 800; }
        .harita-kutu { text-align: center; margin-top: 26px; }
        .konum { margin-top: 18px; text-align: center; color: var(--altin-acik); font-weight: 700; }

        footer { background: rgba(9,10,15,0.88); color: #64748b; text-align: center; padding: 25px 20px; font-size: .95rem; margin-top: 50px; border-top: 2px solid var(--altin); }
        footer a { color: var(--altin); text-decoration: none; font-weight: 700; }

        /* ===== SSS ===== */
        .sss-liste { max-width: 820px; margin: 0 auto; }
        .sss { background: rgba(22,25,32,0.88); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; margin-bottom: 12px; transition: border-color .25s ease; }
        .sss[open] { border-color: var(--altin); }
        .sss summary { cursor: pointer; list-style: none; padding: 16px 48px 16px 18px; font-weight: 700; color: #fff; position: relative; }
        .sss summary::-webkit-details-marker { display: none; }
        .sss summary::after { content: '+'; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: var(--altin-acik); font-size: 1.5rem; font-weight: 800; }
        .sss[open] summary::after { content: '\2212'; }
        .sss p { padding: 0 18px 16px; color: #cbd5e1; }

        /* ===== Dikkat çeken efektler ===== */
        .ilerleme { position: fixed; top: 0; left: 0; height: 4px; width: 0; z-index: 3000; background: linear-gradient(90deg, var(--altin-koyu), var(--altin-acik), #fff, var(--altin-acik)); box-shadow: 0 0 12px rgba(244,211,107,0.9); }
        header h1 { background-size: 100% 100%; animation: none; }
        @keyframes kayan { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
        .kivilcimlar { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
        .kivilcim { position: absolute; bottom: -12px; border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--altin-acik) 40%, transparent 70%); opacity: 0; animation: yuksel linear infinite; }
        @keyframes yuksel { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .95; } 100% { transform: translateY(-640px) scale(1.2); opacity: 0; } }
        .donen { margin: 16px auto 0; min-height: 2.2rem; font-size: clamp(1.15rem, 3.2vw, 1.7rem); font-weight: 800; color: var(--altin-acik); text-shadow: 0 2px 14px rgba(0,0,0,0.95), 0 0 22px rgba(212,175,55,0.6); }
        .donen span { display: inline-block; transition: opacity .5s ease, transform .5s ease; }
        .donen span.gizle { opacity: 0; transform: translateY(10px); }
        .btn.altin { position: relative; overflow: hidden; }
        .btn.altin::after { content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,0.65), transparent); transform: skewX(-20deg); animation: parilti 3.4s ease-in-out infinite; }
        @keyframes parilti { 0%, 55% { left: -80%; } 100% { left: 150%; } }
        .cam { animation: isik 4.5s ease-in-out infinite; }
        @keyframes isik { 0%, 100% { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 34px rgba(212,175,55,0.28); } }
        .kutu .ikon { display: inline-block; transition: transform .35s ease; }
        .kutu:hover .ikon { transform: scale(1.3) rotate(-8deg); }
        .rozet { animation: rozet 3s ease-in-out infinite; }
        @keyframes rozet { 0%, 100% { box-shadow: 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: 0 0 22px rgba(212,175,55,0.65); } }
        @media (prefers-reduced-motion: reduce) { header h1, .btn.altin::after, .cam, .rozet { animation: none; } .kivilcimlar { display: none; } }

        /* ===== Kart düğmeleri ===== */
        .kart img { transition: transform .5s ease; }
        .kart { position: relative; }
        .kart:hover img { transform: scale(1.06); }
        .kart .gorsel { overflow: hidden; background: #000; }
        .kart .iste { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; font-weight: 800; text-decoration: none; color: #fff; background: linear-gradient(135deg, #25d366, #128c7e); }
        .kart .iste svg { width: 20px; height: 20px; fill: #fff; }
        .kart .iste:hover { filter: brightness(1.1); }
        .kutu .ornek { margin-top: 14px; padding: 9px 18px; font-size: .9rem; border-radius: 999px; border: 1px solid var(--altin); background: transparent; color: var(--altin-acik); font-weight: 800; cursor: pointer; transition: all .25s ease; }
        .kutu .ornek:hover { background: var(--altin); color: #111; }

        /* ===== Başlık yazı tipi ===== */
        header h1 { font-family: 'Cinzel', 'Times New Roman', Georgia, serif; font-weight: 800; letter-spacing: 4px; line-height: 1.15; font-size: clamp(2rem, 7vw, 4.4rem); }

        /* ===== Teklif sihirbazı ===== */
        .sihirbaz { max-width: 820px; margin: 0 auto; }
        .sh-ust { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; color: var(--altin-acik); font-size: .9rem; }
        .sh-cubuk { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 26px; }
        .sh-cubuk span { display: block; height: 100%; width: 25%; border-radius: 999px; background: linear-gradient(90deg, var(--altin-koyu), var(--altin-acik)); box-shadow: 0 0 12px rgba(244,211,107,0.7); transition: width .45s ease; }
        .sh-adim { display: none; animation: sh-gir .4s ease; }
        .sh-adim.aktif { display: block; }
        @keyframes sh-gir { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
        .sh-adim h3 { text-align: center; color: #fff; font-size: 1.35rem; margin-bottom: 4px; }
        .sh-adim .sh-ipucu { text-align: center; color: #cbd5e1; font-size: .9rem; margin-bottom: 20px; }
        .sh-secenekler { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
        .sh-sec { text-align: left; cursor: pointer; padding: 16px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.18); background: rgba(22,25,32,0.88); color: #fff; font-size: 1rem; font-weight: 700; transition: all .25s ease; display: flex; align-items: center; gap: 10px; }
        .sh-sec:hover { border-color: var(--altin); transform: translateY(-2px); }
        .sh-sec.secili { border-color: var(--altin-acik); background: linear-gradient(135deg, rgba(244,211,107,0.28), rgba(168,128,31,0.28)); box-shadow: 0 0 0 2px rgba(244,211,107,0.45); }
        .sh-sec.secili::after { content: '\2713'; margin-left: auto; color: var(--altin-acik); font-weight: 800; }
        .sh-gezin { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
        .sh-gezin .btn { padding: 13px 26px; }
        .sh-gezin .btn[hidden] { display: none; }
        .sh-hata { text-align: center; color: #fca5a5; font-weight: 700; min-height: 1.4em; margin-top: 12px; }

        /* ===== Kayan yazı bandı ===== */
        .bant-kap { overflow: hidden; padding: 26px 0; }
        .bant { background: linear-gradient(90deg, var(--altin-koyu), var(--altin-acik) 50%, var(--altin-koyu)); transform: rotate(-1.6deg); margin: 0 -20px; padding: 14px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.55); overflow: hidden; }
        .bant-yol { display: flex; width: max-content; animation: bant-kay 32s linear infinite; }
        .bant-yol span { font-family: 'Cinzel', Georgia, serif; font-weight: 800; font-size: clamp(1.05rem, 2.6vw, 1.5rem); letter-spacing: 3px; color: #111; padding: 0 22px; white-space: nowrap; }
        .bant-yol i { font-style: normal; color: #111; opacity: .6; align-self: center; }
        @keyframes bant-kay { to { transform: translateX(-50%); } }
        @media (prefers-reduced-motion: reduce) { .bant-yol { animation: none; } }

        /* ===== Bento hizmet kutuları ===== */
        .bento { grid-template-columns: repeat(3, 1fr); counter-reset: bk; }
        .bento .kutu { position: relative; overflow: hidden; counter-increment: bk; padding-top: 34px; }

        function kategoriAdi(slug) {

            var TR = {aydinlatmali:'aydınlatmalı',aydinlatma:'aydınlatma',unitesi:'ünitesi',unite:'ünite',alcipan:'alçıpan',cita:'çıta',citali:'çıtalı',cerceve:'çerçeve',polyester:'polyester',ahsap:'ahşap',tavan:'tavan',salon:'salon',yatak:'yatak',odasi:'odası',mutfak:'mutfak',banyo:'banyo',cocuk:'çocuk',oturma:'oturma',girisi:'girişi',giris:'giriş',dekoratif:'dekoratif',duvar:'duvar',boya:'boya',tadilat:'tadilat',once:'önce',sonra:'sonra',luks:'lüks',ozel:'özel',imalat:'imalat',kapi:'kapı',lambri:'lambri',zemin:'zemin',kartonpiyer:'kartonpiyer',tasarim:'tasarım',uygulama:'uygulama',sik:'şık',modern:'modern',isikli:'ışıklı',isik:'ışık',gizli:'gizli',kose:'köşe',koltuk:'koltuk',arkasi:'arkası',yatagi:'yatağı',basi:'başı',cekmece:'çekmece',dolap:'dolap',gardrop:'gardrop',antre:'antre',koridor:'koridor',hol:'hol',tasarimli:'tasarımlı',nisi:'nişi',yuvarlak:'yuvarlak',kare:'kare',ayna:'ayna',dairesel:'dairesel',isikli:'ışıklı',sutunlu:'sütunlu',raf:'raf',kutuphane:'kütüphane',vitrin:'vitrin',perde:'perde',kasasi:'kasası',gizli:'gizli',alci:'alçı',kabartma:'kabartma',rozetli:'rozetli',rozet:'rozet',tablolu:'tablolu',ledli:'LED’li',dokulu:'dokulu',lacivert:'lacivert',gri:'gri',koyu:'koyu',panel:'panel',pano:'pano',asamasi:'aşaması',oval:'oval',isikli:'ışıklı'};

        function agaciAl() {
            try { var o = JSON.parse(sessionStorage.getItem('akd_agac')); if (o && Date.now() - o.t < 300000) { return Promise.resolve(o.v); } } catch (e) {}
            var dallar = ['HEAD', 'main', 'master'];
            function dene(i) {
                if (i >= dallar.length) { return Promise.reject(new Error('liste alinamadi')); }

                    .catch(function () { return dene(i + 1); });

            return dene(0).then(function (tree) {

        }

                if (a.katAdi !== b.katAdi) {
                    if (a.katAdi === DIGER_AD) { return 1; }
                    if (b.katAdi === DIGER_AD) { return -1; }
                    return a.katAdi.localeCompare(b.katAdi, 'tr');

                return a.ad.localeCompare(b.ad, 'tr', { numeric: true });

            return liste;
        }

            } else {
                el = document.createElement('img'); el.src = o.yol; el.alt = baslik; el.loading = 'lazy'; el.decoding = 'async';
            }
            sar.appendChild(el); kart.appendChild(sar);
            if (o.tur === 'video') { var ok = document.createElement('span'); ok.className = 'oynat'; ok.textContent = '▶ VİDEO'; kart.appendChild(ok); }
            var b = document.createElement('div'); b.className = 'baslik'; b.textContent = baslik; kart.appendChild(b);
            var w = document.createElement('a'); w.className = 'iste'; w.target = '_blank'; w.rel = 'noopener'; w.textContent = 'Bunu istiyorum';
            w.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Merhaba, sitenizdeki "' + baslik + '" çalışmasını beğendim. Benzerini yaptırmak istiyorum, bilgi alabilir miyim?');
            kart.appendChild(w);
            kart.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.iste')) { return; } lbListe = galeriListe; lbAc(o.yol); });
            return kart;
        }

        function galeriyiCiz() {
            var liste = tumOgeler.filter(function (o) { return filtre === 'hepsi' || o.katAdi === filtre; });
            galeriListe = liste; lbListe = galeriListe;
            galeri.innerHTML = '';
            if (!liste.length) { mesajYaz('Yakında yeni çalışmalarımız burada olacak.'); dahaFazla.hidden = true; return; }
            liste.slice(0, gosterilen).forEach(function (o) { galeri.appendChild(kartYap(o)); });
            dahaFazla.hidden = liste.length <= gosterilen;
        }
        dahaFazla.addEventListener('click', function () { gosterilen += SAYFA_BOYUTU; galeriyiCiz(); });

        /* ---- Tüm sayfa arka planı: iş fotoğrafları yavaşça döner ---- */
        function arkaPlanBaslat(fotolar) {
            var alan = document.getElementById('sayfa-slides');
            if (!alan || !fotolar.length) { return; }
            var k = fotolar.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 8);
            var sl = k.map(function (d) { var x = document.createElement('div'); x.className = 'slayt'; x.setAttribute('data-yol', d.yol); alan.appendChild(x); return x; });
            function yukle(x) { if (x && !x.style.backgroundImage) { x.style.backgroundImage = 'url("' + x.getAttribute('data-yol') + '")'; } }
            var i = 0; yukle(sl[0]); sl[0].classList.add('aktif'); yukle(sl[1]);
            if (sl.length < 2) { return; }
            setInterval(function () { sl[i].classList.remove('aktif'); i = (i + 1) % sl.length; yukle(sl[i]); sl[i].classList.add('aktif'); yukle(sl[(i + 1) % sl.length]); }, 6500);
        }

        /* ---- Büyük fotoğraf (ileri / geri) ---- */
        var okGeri = buyuk.querySelector('.geri'), okIleri = buyuk.querySelector('.ileri');
        var lbVideo = buyuk.querySelector('.lb-video');
        function lbGoster() {
            var o = lbListe[lbSira]; if (!o) { return; }
            var li = buyuk.querySelector('.lb-iste'); if (li) { li.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Merhaba, sitenizdeki "' + baslikAl(o) + '" çalışmasını beğendim. Benzerini yaptırmak istiyorum, bilgi alabilir miyim?'); }
            okGeri.hidden = okIleri.hidden = lbListe.length < 2;
            if (o.tur === 'video') {
                buyukImg.hidden = true; buyukImg.src = '';
                lbVideo.hidden = false; lbVideo.src = o.yol; lbVideo.play().catch(function () {});
            } else {
                lbVideo.pause(); lbVideo.hidden = true; lbVideo.removeAttribute('src'); lbVideo.load();
                buyukImg.hidden = false; buyukImg.src = o.yol; buyukImg.alt = o.katAdi;
            }
        }
        function lbAc(yol) {
            lbSira = 0;
            for (var i = 0; i < lbListe.length; i++) { if (lbListe[i].yol === yol) { lbSira = i; break; } }
            lbGoster(); buyuk.classList.add('acik');
        }
        function lbGit(y) { if (lbListe.length < 2) { return; } lbSira = (lbSira + y + lbListe.length) % lbListe.length; lbGoster(); }
        function lbKapat() { buyuk.classList.remove('acik'); buyukImg.src = ''; lbVideo.pause(); lbVideo.removeAttribute('src'); lbVideo.load(); }
        buyuk.addEventListener('click', function (e) { if (e.target === lbVideo || (e.target.closest && e.target.closest('.lb-iste'))) { return; } if (e.target === okGeri) { lbGit(-1); } else if (e.target === okIleri) { lbGit(1); } else { lbKapat(); } });
        document.addEventListener('keydown', function (e) {
            if (!buyuk.classList.contains('acik')) { return; }
            if (e.key === 'Escape') { lbKapat(); } else if (e.key === 'ArrowLeft') { lbGit(-1); } else if (e.key === 'ArrowRight') { lbGit(1); }
        });
        var dokX = null;
        buyuk.addEventListener('touchstart', function (e) { dokX = (e.target === lbVideo) ? null : e.touches[0].clientX; }, { passive: true });
        buyuk.addEventListener('touchend', function (e) {
            if (dokX === null) { return; }
            var fark = e.changedTouches[0].clientX - dokX; dokX = null;
            if (Math.abs(fark) > 50) { lbGit(fark < 0 ? 1 : -1); }
        }, { passive: true });

        /* ---- Önce / Sonra (medya/once-sonra klasörü: ad-once.jpg + ad-sonra.jpg) ---- */
        function duzle(t) { return t.toLowerCase().replace(/ö/g, 'o').replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ü/g, 'u'); }
        function onceSonraCiz() {
            if (!document.getElementById('os-izgara')) { return; }
            var gruplar = {};
            osOgeler.forEach(function (o) {
                var ad = duzle(o.ad).replace(/\.[^.]+$/, '');
                var m = ad.match(/^(.*?)[-_ ]*(once|oncesi|sonra|sonrasi)$/);
                if (!m) { return; }
                var anahtar = m[1] || 'is';
                if (!gruplar[anahtar]) { gruplar[anahtar] = {}; }
                gruplar[anahtar][m[2].indexOf('once') === 0 ? 'once' : 'sonra'] = o.yol;
            });
            var alan = document.getElementById('os-izgara'), say = 0;
            Object.keys(gruplar).sort().forEach(function (k) {
                var g = gruplar[k]; if (!g.once || !g.sonra) { return; }
                say++;
                var kart = document.createElement('div'); kart.className = 'os-kart';
                var os = document.createElement('div'); os.className = 'os';
                var i1 = document.createElement('img'); i1.src = g.once; i1.alt = 'Önce'; i1.loading = 'lazy';
                var i2 = document.createElement('img'); i2.src = g.sonra; i2.alt = 'Sonra'; i2.className = 'os-sonra'; i2.loading = 'lazy';
                var c = document.createElement('div'); c.className = 'cizgi-os';
                var t = document.createElement('div'); t.className = 'tutac'; t.textContent = '↔';
                var e1 = document.createElement('span'); e1.className = 'etk sol'; e1.textContent = 'ÖNCE';
                var e2 = document.createElement('span'); e2.className = 'etk sag'; e2.textContent = 'SONRA';
                var gir = document.createElement('input'); gir.type = 'range'; gir.min = 0; gir.max = 100; gir.value = 50; gir.setAttribute('aria-label', 'Önce sonra karşılaştırma');
                gir.addEventListener('input', function () { os.style.setProperty('--x', gir.value + '%'); });
                [i1, i2, c, t, e1, e2, gir].forEach(function (x) { os.appendChild(x); });
                var b = document.createElement('div'); b.className = 'baslik'; b.textContent = k === 'is' ? 'Önce / Sonra' : ilkHarfBuyut(k.replace(/[-_]+/g, ' '));
                kart.appendChild(os); kart.appendChild(b); alan.appendChild(kart);
            });
            if (say) { document.getElementById('once-sonra').hidden = false; }
        }

        /* ---- Hizmet kutusu -> o işin örnekleri ---- */
        Array.prototype.forEach.call(document.querySelectorAll('[data-anahtar]'), function (d) {
            d.addEventListener('click', function () {
                var anahtarlar = d.getAttribute('data-anahtar').split('|'), bulunan = null;
                tumOgeler.forEach(function (o) {
                    if (bulunan || !o.kat) { return; }
                    var ad = o.katAdi.toLocaleLowerCase('tr');
                    anahtarlar.forEach(function (a) { if (!bulunan && ad.indexOf(a) > -1) { bulunan = o.katAdi; } });
                });
                filtre = bulunan || 'hepsi'; gosterilen = SAYFA_BOYUTU; filtreleriCiz(); galeriyiCiz();
                document.getElementById('calismalar').scrollIntoView({ behavior: 'smooth' });
            });
        });

        /* ---- Kaydırınca beliren bölümler ---- */
        var gizliler = document.querySelectorAll('.gizli');
        if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (es) {
                es.forEach(function (x) { if (x.isIntersecting) { x.target.classList.add('gor'); io.unobserve(x.target); } });
            }, { threshold: 0.08 });
            Array.prototype.forEach.call(gizliler, function (g) { io.observe(g); });
        } else {
            Array.prototype.forEach.call(gizliler, function (g) { g.classList.add('gor'); });
        }

        /* ---- Adres çubuğundan gelen iş türü (?is=tavan|alcipan) ---- */
        function urldenFiltre() {
            var q = new URLSearchParams(location.search).get('is');
            if (!q) { return; }
            var anahtarlar = q.split('|'), bulunan = null;
            tumOgeler.forEach(function (o) {
                if (bulunan || !o.kat) { return; }
                var ad = duzle(o.katAdi.toLocaleLowerCase('tr'));
                anahtarlar.forEach(function (a) { if (!bulunan && ad.indexOf(a) > -1) { bulunan = o.katAdi; } });
            });
            if (bulunan) { filtre = bulunan; }
        }

        /* ---- Başlat ---- */
        agaciAl().then(function (tree) {
            tumOgeler = ogeleriHazirla(tree);
            arkaPlanBaslat(tumFotolar);
            urldenFiltre();
            filtreleriCiz(); galeriyiCiz(); onceSonraCiz();
        }).catch(function () {
            mesajYaz('Çalışmalar şu an yüklenemedi. Lütfen birkaç dakika sonra sayfayı yenileyin.');
        });
    })();
    </script>
